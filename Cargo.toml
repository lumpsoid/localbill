[package]
name = "localbill"
version = "0.1.0"
edition = "2021"
description = "Local billing and invoice management CLI"

[[bin]]
name = "localbill"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Serialisation: YAML frontmatter and JSON API responses
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# Minimal synchronous HTTP client (no async runtime)
ureq = { version = "3.2.0", features = ["json"] }

# HTML parsing for Serbian fiscal invoice pages
scraper = "0.20"
jsonschema = { version = "0.44.1", default-features = false }
regex = { version = "1", default-features = false, features = ["std"] }

# Datetime arithmetic for the interactive `add` offset expressions (+1d, -2h …).
# `local-offset` is intentionally omitted: "now" comes from the Clock port, so
# `time` is used only to parse/format/shift an ISO-8601 string.
time = { version = "0.3.47", features = ["parsing", "formatting", "macros"] }

# Terminal styling for the interactive form, behind the Styler port. Default
# features are off to drop the event stack (mio/signal-hook) — only `style`.
crossterm = { version = "0.29.0", default-features = false }

[dev-dependencies]
tempfile = "3.26.0"
